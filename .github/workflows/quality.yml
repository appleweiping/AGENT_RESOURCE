name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate complete skill library
        shell: pwsh
        run: ./tools/Test-SkillLibrary.ps1

      - name: Enforce strict validation on changed skills
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./tools/Test-SkillLibrary.ps1 -ChangedFrom '${{ github.event.pull_request.base.sha }}' -SkipTests

      - name: Enforce strict validation on directly pushed skills
        if: github.event_name == 'push'
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSHED_REF: ${{ github.ref_name }}
        run: |
          $zeroSha = '0000000000000000000000000000000000000000'
          $base = $env:BEFORE_SHA
          if ($base -eq $zeroSha) {
            if ($env:PUSHED_REF -eq $env:DEFAULT_BRANCH) {
              Write-Host 'No baseline exists; strictly validating the complete library.'
              ./tools/Test-SkillLibrary.ps1 -Strict -SkipTests
              exit $LASTEXITCODE
            }
            $defaultRef = "refs/remotes/origin/$($env:DEFAULT_BRANCH)"
            git rev-parse --verify --quiet $defaultRef | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'No baseline exists; strictly validating the complete library.'
              ./tools/Test-SkillLibrary.ps1 -Strict -SkipTests
              exit $LASTEXITCODE
            }
            $base = $defaultRef
          }
          ./tools/Test-SkillLibrary.ps1 -ChangedFrom $base -SkipTests

      - name: Run routing and public-safety smoke tests
        shell: pwsh
        run: |
          ./tools/Test-ImplicitSkillRouting.ps1
          ./tools/Test-PublicSafety.ps1
