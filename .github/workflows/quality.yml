name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate SKILL.md files and run unit tests
        shell: pwsh
        run: ./tools/Test-SkillLibrary.ps1 -Strict

      - name: Check relative Markdown links
        run: python tools/check_links.py

      - name: Scan for committed secrets and local paths
        shell: pwsh
        run: ./tools/Test-PublicSafety.ps1

  workstation-maintenance:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the self-test on temporary folders (Windows PowerShell 5.1)
        shell: powershell
        run: .\skills\vipin\workstation-maintenance\scripts\Test-WorkstationMaintenance.ps1
