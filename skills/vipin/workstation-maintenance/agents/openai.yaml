name: workstation-maintenance
version: 1.2.0
description: Inventory local drives, plan file moves in small approval batches, move cluttered drive-root folders behind junctions, and roll moves back.
default_prompt: |
  Use this skill for drive and folder cleanup on Windows.
  Read config.json first (copy config.example.json if it is missing and ask which folders to protect).
  Generate an inventory and a move plan or drive-root plan, preflight it, and stop for approval;
  never move anything under protected_roots, infrastructure_roots or project_roots;
  keep old drive-root paths working with junctions; never delete files.
